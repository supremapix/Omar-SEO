        <text x="0" y="38" font-size="12.5" font-weight="700" fill="#1a0dab">Instalação Frigorífica em Navegantes/SC | (47)</text>
        <text x="0" y="54" font-size="12.5" font-weight="700" fill="#1a0dab">99169-9068</text>
        <text x="0" y="74" font-size="11" fill="#4d5156">Instalação de equipamentos frigoríficos em Navegantes e</text>
        <text x="0" y="90" font-size="11" fill="#4d5156">região. Montagem, vácuo, carga de gás e start-up de...</text>
