<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1045 262" width="1045" height="262">
  <defs>
    <style>
      .txt-search { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #202124; }
      .txt-domain { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #202124; font-weight: 400; }
      .txt-url { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #4d5156; }
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; fill: #681da8; font-weight: 400; cursor: pointer; }
      .txt-snippet { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #4d5156; line-height: 1.58; }
      .txt-bold { font-weight: 700; fill: #3c4043; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1045" height="262" fill="#ffffff"/>

  <!-- Google Logo -->
  <g transform="translate(18, 14)">
    <text font-family="Arial, sans-serif" font-size="28" font-weight="bold" letter-spacing="-0.5">
      <tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan>
    </text>
  </g>

  <!-- Search Input Pill -->
  <rect x="148" y="12" width="860" height="46" rx="23" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
  <text x="168" y="41" class="txt-search">advogados planos de saude</text>

  <!-- Search Pill Right Controls -->
  <!-- X button -->
  <g transform="translate(810, 26)" stroke="#70757a" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="14" y2="14"/>
    <line x1="14" y1="0" x2="0" y2="14"/>
  </g>
  <!-- Separator -->
  <line x1="840" y1="23" x2="840" y2="47" stroke="#dadce0" stroke-width="1"/>

  <!-- Keyboard Icon -->
  <g transform="translate(853, 26)">
    <rect x="0" y="2" width="18" height="12" rx="2" fill="none" stroke="#70757a" stroke-width="1.2"/>
    <rect x="3" y="5" width="2" height="2" fill="#70757a"/>
    <rect x="8" y="5" width="2" height="2" fill="#70757a"/>
    <rect x="13" y="5" width="2" height="2" fill="#70757a"/>
    <rect x="5" y="9" width="8" height="2" fill="#70757a"/>
  </g>

  <!-- Microphone Icon -->
  <g transform="translate(888, 25)">
    <path d="M6 10c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2s-2 .9-2 2v4c0 1.1.9 2 2 2z" fill="#4285f4"/>
    <path d="M10 8c0 2.2-1.8 4-4 4s-4-1.8-4-4H0c0 3 2.2 5.4 5 5.9V17h2v-3.1c2.8-.5 5-2.9 5-5.9h-2z" fill="#34a853"/>
  </g>

  <!-- Lens Icon -->
  <g transform="translate(922, 25)">
    <circle cx="7" cy="7" r="5" fill="none" stroke="#4285f4" stroke-width="2"/>
    <circle cx="10" cy="4" r="1.5" fill="#ea4335"/>
  </g>

  <!-- Magnifying Glass -->
  <g transform="translate(956, 24)">
    <circle cx="7" cy="7" r="5" fill="none" stroke="#4285f4" stroke-width="2"/>
    <line x1="11" y1="11" x2="16" y2="16" stroke="#4285f4" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Organic Result Row -->
  <!-- Favicon Badge -->
  <circle cx="178" cy="112" r="14" fill="#f1f3f4" stroke="#e0e0e0" stroke-width="1"/>
  <text x="178" y="117" font-family="Arial" font-size="13" fill="#80868b" text-anchor="middle" font-weight="bold">S</text>

  <!-- Domain & Breadcrumb -->
  <text x="202" y="108" class="txt-domain">cicarelli.adv.br</text>
  <text x="202" y="125" class="txt-url">https://www.cicarelli.adv.br › contato</text>

  <!-- Three-Dots Menu -->
  <g transform="translate(775, 110)" fill="#70757a">
    <circle cx="0" cy="0" r="1.8"/>
    <circle cx="0" cy="6" r="1.8"/>
    <circle cx="0" cy="12" r="1.8"/>
  </g>

  <!-- Title Link (Purple) -->
  <text x="165" y="152" class="txt-title">Contato - Advogado Planos de Saúde Curitiba</text>

  <!-- Snippet Text -->
  <text x="165" y="178" class="txt-snippet">
    <tspan class="txt-bold">Advogado especializado em planos de saúde em Curitiba</tspan>. Defesa contra negativa de cobertura,
  </text>
  <text x="165" y="198" class="txt-snippet">
    reembolso médico e direitos de beneficiários.
  </text>

  <!-- Highlight Red Arrow -->
  <g>
    <path d="M 990 248 Q 900 215 798 148" fill="none" stroke="#d9534f" stroke-width="7" stroke-linecap="round"/>
    <polygon points="786,140 812,143 800,165" fill="#d9534f"/>
  </g>
</svg>