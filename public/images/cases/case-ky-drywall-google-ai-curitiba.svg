<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" width="1180" height="680" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d93025" />
    </marker>
  </defs>

  <!-- Google Search Header -->
  <g transform="translate(30, 25)">
    <!-- Google Logo -->
    <path d="M22.5 10.8c0-.8-.1-1.5-.2-2.2H11.5v4.2h6.2c-.3 1.4-1.1 2.6-2.3 3.4v2.8h3.7c2.2-2 3.4-5 3.4-8.2z" fill="#4285F4"/>
    <path d="M11.5 22c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 1-2.4 1.5-3.9 1.5-3 0-5.5-2-6.4-4.8H1.2v3c1.9 3.8 5.8 6.1 10.3 6.1z" fill="#34A853"/>
    <path d="M5.1 13.1c-.2-.7-.3-1.4-.3-2.1s.1-1.4.3-2.1V5.9H1.2C.4 7.5 0 9.2 0 11s.4 3.5 1.2 5.1l3.9-3z" fill="#FBBC05"/>
    <path d="M11.5 4.4c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.2 1 14.6 0 11.5 0 7 0 3.1 2.3 1.2 6.1l3.9 3c.9-2.8 3.4-4.7 6.4-4.7z" fill="#EA4335"/>

    <!-- Search Input Box -->
    <rect x="110" y="-12" width="670" height="46" rx="23" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
    <text x="140" y="17" font-size="15" fill="#202124" font-weight="400">qual empresa drywall em curitiba</text>

    <!-- Search Controls -->
    <g transform="translate(670, 0)" fill="#70757a">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" transform="scale(0.8) translate(-10,-5)"/>
      <path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 5H5v-2h2v2zm0-3H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-3h-2v-2h2v2zm0-3h-2V8h2v2zm3 6h-2v-2h2v2zm0-3h-2v-2h2v2zm0-3h-2V8h2v2z" transform="scale(0.7) translate(30,-5)" fill="#70757a"/>
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" transform="scale(0.7) translate(70,-5)" fill="#4285F4"/>
    </g>
  </g>

  <!-- Navigation Tabs -->
  <g transform="translate(140, 85)" font-size="13" fill="#5f6368" font-weight="500">
    <text x="0" y="0">Modo IA</text>
    <text x="70" y="0" fill="#1a73e8" font-weight="700">Tudo</text>
    <line x1="68" y1="8" x2="106" y2="8" stroke="#1a73e8" stroke-width="3"/>
    <text x="125" y="0">Vagas de emprego</text>
    <text x="255" y="0">Shopping</text>
    <text x="330" y="0">Imagens</text>
    <text x="400" y="0">Vídeos curtos</text>
    <text x="495" y="0">Vídeos</text>
    <text x="555" y="0">Mais ▾</text>
    <text x="615" y="0">Ferramentas ▾</text>
  </g>
  <line x1="0" y1="98" x2="1180" y2="98" stroke="#ebebeb" stroke-width="1"/>

  <!-- Location Indicator -->
  <g transform="translate(140, 125)">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#70757a" transform="scale(0.7) translate(-5,-12)"/>
    <text x="18" y="0" font-size="13" font-weight="700" fill="#202124">Curitiba, PR</text>
    <text x="95" y="0" font-size="13" fill="#1a0dab">· Escolher região</text>
    <circle cx="210" cy="-4" r="2" fill="#70757a"/>
    <circle cx="210" cy="1" r="2" fill="#70757a"/>
    <circle cx="210" cy="6" r="2" fill="#70757a"/>
  </g>

  <!-- AI OVERVIEW SECTION -->
  <g transform="translate(140, 150)">
    <!-- AI Sparkles Header -->
    <g transform="translate(0, 0)">
      <path d="M12 23c0-6.075-4.925-11-11-11 6.075 0 11-4.925 11-11 0 6.075 4.925 11 11 11-6.075 0-11 4.925-11 11z" fill="#1a73e8" transform="scale(0.7)"/>
      <path d="M22 9c0-2.76-2.24-5-5-5 2.76 0 5-2.24 5-5 0 2.76 2.24 5 5 5-2.76 0-5 2.24-5 5z" fill="#4285F4" transform="scale(0.5) translate(28,-10)"/>
      <text x="28" y="13" font-size="14" font-weight="700" fill="#1a73e8">Visão geral criada por IA</text>
      <circle cx="185" cy="9" r="10" fill="#f1f3f4"/>
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" fill="#5f6368" transform="translate(178,2) scale(0.65)"/>
    </g>

    <!-- Paragraph 1 with Blue Highlights -->
    <g transform="translate(0, 32)">
      <text x="0" y="16" font-size="13.5" fill="#202124">As principais empresas de drywall em Curitiba incluem <tspan font-weight="700" fill="#001d35">fornecedores de materiais e</tspan></text>
      <text x="0" y="34" font-size="13.5" fill="#202124"><tspan font-weight="700" fill="#001d35">prestadores de serviços de instalação para obras e reformas.</tspan></text>
      <rect x="345" y="4" width="160" height="15" fill="#d2e3fc" opacity="0.8"/>
      <rect x="0" y="22" width="410" height="15" fill="#d2e3fc" opacity="0.8"/>
    </g>

    <!-- Subtitle: Lojas de Materiais e Distribuidoras -->
    <text x="0" y="92" font-size="16" font-weight="700" fill="#202124">Lojas de Materiais e Distribuidoras</text>

    <!-- Bullet 1: Redacted GDS Drywall -->
    <g transform="translate(0, 114)">
      <text x="0" y="12" font-size="13" fill="#202124">• </text>
      <text x="14" y="12" font-size="13" font-weight="700" fill="#202124">GDS Drywall</text>
      <text x="100" y="12" font-size="13" fill="#202124">: Grande distribuidora de drywall e steel frame no Sul do Brasil, localizada</text>
      <text x="14" y="30" font-size="13" fill="#202124">na BR-277... Contact: (41) 3238-2009.</text>

      <!-- Red strike lines over GDS -->
      <line x1="12" y1="10" x2="110" y2="10" stroke="#d93025" stroke-width="2"/>
      <line x1="140" y1="28" x2="250" y2="28" stroke="#d93025" stroke-width="2"/>
    </g>

    <!-- Bullet 2: KY Drywall & Steel Frame (PROMINENT TARGET) -->
    <g transform="translate(0, 170)">
      <text x="0" y="12" font-size="13.5" fill="#202124">• </text>
      <text x="14" y="12" font-size="14" font-weight="800" fill="#000000">KY Drywall &amp; Steel Frame</text>
      <text x="200" y="12" font-size="13.5" fill="#202124">: Loja especializada na BR-277, no Cajuru, operando desde</text>
      <text x="14" y="32" font-size="13.5" fill="#202124">1998 com entrega própria. Conheça mais no site <tspan font-weight="700" fill="#1a0dab" text-decoration="underline">KY Drywall &amp; Steel Frame</tspan> ou pelo</text>
      <text x="14" y="52" font-size="13.5" fill="#202124">WhatsApp (41) 3528-4232.</text>

      <!-- Source pill -->
      <rect x="220" y="42" width="85" height="18" rx="9" fill="#f1f3f4"/>
      <circle cx="230" cy="51" r="5" fill="#5f6368"/>
      <text x="238" y="54" font-size="10.5" fill="#3c4043" font-weight="600">KY Drywall</text>
    </g>

    <!-- Bullet 3: Redacted Wall Shop -->
    <g transform="translate(0, 245)">
      <text x="0" y="12" font-size="13" fill="#202124">• </text>
      <text x="14" y="12" font-size="13" font-weight="700" fill="#202124">Wall Shop</text>
      <text x="85" y="12" font-size="13" fill="#202124">: Atua desde 1999 fornecendo placas, detalhes na página da <tspan fill="#1a0dab" text-decoration="underline">Wall Shop</tspan>.</text>
      <line x1="12" y1="10" x2="85" y2="10" stroke="#d93025" stroke-width="2"/>
      <line x1="320" y1="28" x2="380" y2="28" stroke="#d93025" stroke-width="2"/>
    </g>
  </g>

  <!-- Bottom-Right Hover/Popover Card for KY Drywall -->
  <g transform="translate(680, 420)">
    <rect x="0" y="0" width="410" height="110" rx="16" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#cardShadow)"/>
    <circle cx="25" cy="28" r="7" fill="#e8eaed"/>
    <text x="38" y="32" font-size="12" font-weight="600" fill="#3c4043">KY Drywall</text>
    <text x="20" y="58" font-size="13.5" font-weight="700" fill="#1a0dab">KY Drywall &amp; Steel Frame - Maior Loja</text>
    <text x="20" y="78" font-size="13.5" font-weight="700" fill="#1a0dab">de Curitiba | BR-277 Cajuru</text>

    <!-- KY Logo Box -->
    <rect x="305" y="15" width="85" height="80" rx="8" fill="#ffffff" stroke="#f0f0f0"/>
    <rect x="305" y="15" width="85" height="80" rx="8" fill="#d93025"/>
    <text x="312" y="62" font-size="28" font-weight="900" fill="#ffffff" font-family="sans-serif">KY</text>
    <text x="350" y="62" font-size="16" font-weight="700" fill="#ffffff" font-family="sans-serif">Dry</text>
  </g>

  <!-- Red Arrows Layer (Preserving exact evidence arrows from screenshot) -->
  <g stroke="#d93025" stroke-width="4" fill="none">
    <!-- Arrow 1: From Google logo/Header down to AI Overview bullet -->
    <path d="M 80 40 Q 110 180 135 410" marker-end="url(#arrow)"/>

    <!-- Arrow 2: From query line to AI overview bullet -->
    <path d="M 460 35 Q 260 220 230 290" marker-end="url(#arrow)"/>

    <!-- Arrow 3: Red arrow pointing to GDS Drywall -->
    <path d="M 230 330 L 290 330" marker-end="url(#arrow)"/>

    <!-- Arrow 4: Pointing from query down to KY Drywall popover card -->
    <path d="M 680 40 Q 820 200 900 420" marker-end="url(#arrow)"/>

    <!-- Arrow 5: Pointing to Wall Shop line -->
    <path d="M 230 490 L 290 490" marker-end="url(#arrow)"/>
  </g>
</svg>
