<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d93025" />
    </marker>
  </defs>

  <!-- Google Search Header -->
  <g transform="translate(30, 25)">
    <!-- Google Logo -->
    <path d="M22.5 10.8c0-.8-.1-1.5-.2-2.2H11.5v4.2h6.2c-.3 1.4-1.1 2.6-2.3 3.4v2.8h3.7c2.2-2 3.4-5 3.4-8.2z" fill="#4285F4"/>
    <path d="M11.5 22c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 1-2.4 1.5-3.9 1.5-3 0-5.5-2-6.4-4.8H1.2v3c1.9 3.8 5.8 6.1 10.3 6.1z" fill="#34A853"/>
    <path d="M5.1 13.1c-.2-.7-.3-1.4-.3-2.1s.1-1.4.3-2.1V5.9H1.2C.4 7.5 0 9.2 0 11s.4 3.5 1.2 5.1l3.9-3z" fill="#FBBC05"/>
    <path d="M11.5 4.4c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.2 1 14.6 0 11.5 0 7 0 3.1 2.3 1.2 6.1l3.9 3c.9-2.8 3.4-4.7 6.4-4.7z" fill="#EA4335"/>

    <!-- Search Input Box -->
    <rect x="110" y="-12" width="670" height="46" rx="23" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
    <text x="140" y="17" font-size="16" fill="#202124" font-weight="400">alevinos</text>

    <!-- Search Controls -->
    <g transform="translate(670, 0)" fill="#70757a">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" transform="scale(0.8) translate(-10,-5)"/>
      <path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 5H5v-2h2v2zm0-3H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-3h-2v-2h2v2zm0-3h-2V8h2v2zm3 6h-2v-2h2v2zm0-3h-2v-2h2v2zm0-3h-2V8h2v2z" transform="scale(0.7) translate(30,-5)" fill="#70757a"/>
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" transform="scale(0.7) translate(70,-5)" fill="#4285F4"/>
      <circle cx="95" cy="10" r="10" stroke="#70757a" stroke-width="2" fill="none"/>
      <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" transform="scale(0.7) translate(110,-5)" fill="#4285F4"/>
    </g>
  </g>
  <line x1="0" y1="80" x2="1000" y2="80" stroke="#ebebeb" stroke-width="1"/>

  <!-- MAIN CONTENT AREA -->
  <g transform="translate(140, 100)">

    <!-- LOCAL PACK RESULT CARD -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="560" height="150" rx="12" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
      
      <!-- Business Info Left -->
      <text x="20" y="32" font-size="17" font-weight="700" fill="#202124">Alevinos Curitiba &amp; Peixes Vivos</text>
      
      <!-- Rating Stars -->
      <g transform="translate(20, 42)">
        <text x="0" y="12" font-size="13" font-weight="700" fill="#202124">5,0</text>
        <g transform="translate(25, 2)" fill="#fbbc04">
          <polygon points="6,0 8,4 12,4 9,7 10,11 6,8 2,11 3,7 0,4 4,4"/>
          <polygon points="20,0 22,4 26,4 23,7 24,11 20,8 16,11 17,7 14,4 18,4"/>
          <polygon points="34,0 36,4 40,4 37,7 38,11 34,8 30,11 31,7 28,4 32,4"/>
          <polygon points="48,0 50,4 54,4 51,7 52,11 48,8 44,11 45,7 42,4 46,4"/>
          <polygon points="62,0 64,4 68,4 65,7 66,11 62,8 58,11 59,7 56,4 60,4"/>
        </g>
        <text x="98" y="12" font-size="13" fill="#70757a">(39) · Criação de peixes</text>
      </g>

      <!-- Location & Phone -->
      <text x="20" y="76" font-size="13" fill="#4d5156">Colombo - PR · (41) 99669-2423</text>
      
      <!-- Hours Status -->
      <text x="20" y="96" font-size="13" fill="#d93025" font-weight="600">Fechado<tspan fill="#4d5156" font-weight="400"> · Abre ter. às 09:00</tspan></text>
      
      <!-- Review Quote -->
      <g transform="translate(20, 110)">
        <circle cx="8" cy="8" r="8" fill="#4285f4"/>
        <path d="M8 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6c-2.67 0-8 1.34-8 4v1h16v-1c0-2.66-5.33-4-8-4z" fill="#ffffff" transform="scale(0.6) translate(3,3)"/>
        <text x="22" y="12" font-size="12.5" fill="#4d5156">"<tspan font-weight="700" fill="#202124">Alevinos</tspan> de qualidade excelente atendimento"</text>
      </g>

      <!-- Image thumbnail Right -->
      <rect x="460" y="20" width="80" height="80" rx="8" fill="#388e3c"/>
      <path d="M460 20 h80 v80 h-80 z" fill="#2e7d32" rx="8"/>
      <!-- Hands holding fish illustration -->
      <ellipse cx="500" cy="65" rx="30" ry="18" fill="#d7ccc8"/>
      <circle cx="495" cy="55" r="4" fill="#00bcd4"/>
      <circle cx="505" cy="58" r="3" fill="#00bcd4"/>
      <circle cx="490" cy="60" r="3.5" fill="#00bcd4"/>
      <circle cx="510" cy="52" r="2.5" fill="#00bcd4"/>
    </g>

    <!-- Mais Lugares Button -->
    <g transform="translate(130, 165)">
      <rect x="0" y="0" width="300" height="34" rx="17" fill="#f1f3f4"/>
      <text x="110" y="22" font-size="13" font-weight="500" fill="#3c4043">Mais lugares ›</text>
    </g>

    <!-- AS PESSOAS TAMBÉM PERGUNTAM (PAA) -->
    <g transform="translate(0, 230)">
      <text x="0" y="18" font-size="18" font-weight="600" fill="#202124">As pessoas também perguntam</text>
      
      <g transform="translate(0, 30)">
        <line x1="0" y1="0" x2="560" y2="0" stroke="#ebebeb"/>
        <text x="0" y="25" font-size="14" fill="#202124">Quem são os alevinos?</text>
        <path d="M540 18 l5 5 l5 -5" stroke="#70757a" stroke-width="2" fill="none"/>
        
        <line x1="0" y1="40" x2="560" y2="40" stroke="#ebebeb"/>
        <text x="0" y="65" font-size="14" fill="#202124">Qual o valor do alevino?</text>
        <path d="M540 58 l5 5 l5 -5" stroke="#70757a" stroke-width="2" fill="none"/>

        <line x1="0" y1="80" x2="560" y2="80" stroke="#ebebeb"/>
        <text x="0" y="105" font-size="14" fill="#202124">Quanto custa 1.000 alevinos?</text>
        <path d="M540 98 l5 5 l5 -5" stroke="#70757a" stroke-width="2" fill="none"/>

        <line x1="0" y1="120" x2="560" y2="120" stroke="#ebebeb"/>
        <text x="0" y="145" font-size="14" fill="#202124">Quais são os peixes ovíparos?</text>
        <path d="M540 138 l5 5 l5 -5" stroke="#70757a" stroke-width="2" fill="none"/>
        <line x1="0" y1="160" x2="560" y2="160" stroke="#ebebeb"/>
      </g>
    </g>

    <!-- ORGANIC RESULT 1: Mercado Livre -->
    <g transform="translate(0, 440)">
      <circle cx="10" cy="10" r="10" fill="#ffe600"/>
      <text x="7" y="14" font-size="10" font-weight="900" fill="#2d327d">m</text>
      <text x="30" y="8" font-size="12" fill="#202124" font-weight="500">Mercado Livre</text>
      <text x="30" y="22" font-size="11" fill="#4d5156">https://lista.mercadolivre.com.br › ... › Peixes › Peixes</text>
      
      <text x="0" y="45" font-size="18" fill="#1a0dab" font-weight="500">Alevinos</text>
      <text x="0" y="66" font-size="13" fill="#4d5156"><tspan font-weight="700">Os alevinos representam a fase inicial do ciclo produtivo na piscicultura</tspan>, correspondendo aos</text>
      <text x="0" y="84" font-size="13" fill="#4d5156">peixes recém-eclodidos até o estágio juvenil.</text>
      <text x="0" y="104" font-size="12" fill="#70757a">4,7 ★ classificação da loja (2,5 mil)</text>
    </g>

    <!-- ORGANIC RESULT 2: Alevinos Curitiba (TARGET) -->
    <g transform="translate(0, 570)">
      <!-- Favicon -->
      <circle cx="12" cy="12" r="12" fill="#202124"/>
      <text x="8" y="17" font-size="13" font-weight="900" fill="#ffffff" font-family="sans-serif">S</text>
      
      <text x="32" y="10" font-size="13" fill="#202124" font-weight="500">Alevinos Curitiba</text>
      <text x="32" y="24" font-size="11" fill="#4d5156">https://www.alevinoscuritiba.com.br</text>
      <circle cx="535" cy="14" r="2" fill="#70757a"/>
      <circle cx="535" cy="8" r="2" fill="#70757a"/>
      <circle cx="535" cy="20" r="2" fill="#70757a"/>

      <text x="0" y="52" font-size="20" fill="#1a0dab" font-weight="500" text-decoration="underline">Alevinos em Curitiba | Fornecedor e Venda no Paraná</text>
      
      <text x="0" y="74" font-size="13.5" fill="#4d5156">Alevinos Curitiba - <tspan font-weight="700" fill="#202124">Especializada na venda no atacado e varejo de alevinos</tspan> (filhotes de peixes). +20</text>
      <text x="0" y="94" font-size="13.5" fill="#4d5156">espécies: Dourado, Pintado Gaúcho, Lambari Gigante, ...</text>
    </g>

  </g>

  <!-- RED ARROWS OVERLAY (Matching screenshot arrows) -->
  <g stroke="#d93025" stroke-width="4" fill="none">
    <!-- Arrow 1: Pointing to Local Pack title -->
    <path d="M 20 190 Q 70 180 130 145" marker-end="url(#arrow)"/>

    <!-- Arrow 2: Diagonal long arrow pointing down to organic snippet -->
    <path d="M 760 670 L 470 210" marker-start="url(#arrow)"/>

    <!-- Arrow 3: Arrow on bottom-left pointing to Alevinos Curitiba organic result -->
    <path d="M 30 630 Q 80 650 130 675" marker-end="url(#arrow)"/>
  </g>
</svg>
