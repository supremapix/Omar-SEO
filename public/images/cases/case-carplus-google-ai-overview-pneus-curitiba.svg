<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620">
  <defs>
    <style>
      .txt-search { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; fill: #202124; }
      .txt-tab { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #5f6368; }
      .txt-tab-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #202124; font-weight: 500; }
      .txt-loc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #202124; font-weight: 500; }
      .txt-link { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #1a0dab; text-decoration: underline; }
      .txt-ai-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f1f1f; font-weight: 600; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #3c4043; line-height: 1.58; }
      .txt-bold { font-weight: 700; fill: #1f1f1f; }
      .txt-highlight { background-color: #d3e3fd; fill: #041e49; font-weight: 600; }
      .txt-card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #1a0dab; font-weight: 500; }
      .txt-card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #4d5156; }
      .txt-pop-url { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #4d5156; }
      .txt-pop-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #1a0dab; font-weight: 600; }
    </style>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1180" height="620" fill="#ffffff"/>

  <!-- Google Logo -->
  <g transform="translate(30, 24)">
    <text font-family="Arial, sans-serif" font-size="30" font-weight="bold" letter-spacing="-0.5">
      <tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan>
    </text>
  </g>

  <!-- Search Input Bar Pill -->
  <rect x="160" y="18" width="760" height="48" rx="24" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
  <text x="185" y="48" class="txt-search">Oficinas dos Pneus Curitiba</text>

  <!-- Right side icons inside search pill -->
  <g transform="translate(750, 32)">
    <!-- X icon -->
    <path d="M0 0 L12 12 M12 0 L0 12" stroke="#70757a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(780, 31)">
    <!-- Keyboard icon -->
    <rect x="0" y="2" width="18" height="12" rx="2" fill="none" stroke="#70757a" stroke-width="1.2"/>
    <rect x="3" y="5" width="2" height="2" fill="#70757a"/>
    <rect x="8" y="5" width="2" height="2" fill="#70757a"/>
    <rect x="13" y="5" width="2" height="2" fill="#70757a"/>
    <rect x="5" y="9" width="8" height="2" fill="#70757a"/>
  </g>

  <g transform="translate(820, 30)">
    <!-- Mic icon -->
    <path d="M6 10c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2s-2 .9-2 2v4c0 1.1.9 2 2 2z" fill="#4285f4"/>
    <path d="M10 8c0 2.2-1.8 4-4 4s-4-1.8-4-4H0c0 3 2.2 5.4 5 5.9V17h2v-3.1c2.8-.5 5-2.9 5-5.9h-2z" fill="#34a853"/>
  </g>

  <g transform="translate(855, 30)">
    <!-- Lens icon -->
    <circle cx="7" cy="7" r="5" fill="none" stroke="#4285f4" stroke-width="2"/>
    <circle cx="10" cy="4" r="1.5" fill="#ea4335"/>
  </g>

  <g transform="translate(890, 29)">
    <!-- Magnifying glass icon -->
    <circle cx="7" cy="7" r="5" fill="none" stroke="#4285f4" stroke-width="2"/>
    <line x1="11" y1="11" x2="16" y2="16" stroke="#4285f4" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Navigation Tabs Line -->
  <g transform="translate(180, 105)">
    <text x="0" y="0" class="txt-tab">Modo IA</text>
    <text x="80" y="0" class="txt-tab-active">Tudo</text>
    <line x1="78" y1="8" x2="114" y2="8" stroke="#202124" stroke-width="3"/>
    <text x="140" y="0" class="txt-tab">Shopping</text>
    <text x="225" y="0" class="txt-tab">Imagens</text>
    <text x="305" y="0" class="txt-tab">Vídeos</text>
    <text x="375" y="0" class="txt-tab">Maps</text>
    <text x="435" y="0" class="txt-tab">Vídeos curtos</text>
    <text x="545" y="0" class="txt-tab">Mais ▾</text>
    <text x="615" y="0" class="txt-tab">Ferramentas ▾</text>
  </g>

  <line x1="0" y1="122" x2="1180" y2="122" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Location Header -->
  <g transform="translate(180, 155)">
    <!-- Location Pin -->
    <path d="M 12 2 C 7.58 2 4 5.58 4 10 C 4 16 12 22 12 22 C 12 22 20 16 20 10 C 20 5.58 16.42 2 12 2 Z M 12 12.5 C 10.62 12.5 9.5 11.38 9.5 10 C 9.5 8.62 10.62 7.5 12 7.5 C 13.38 7.5 14.5 8.62 14.5 10 C 14.5 11.38 13.38 12.5 12 12.5 Z" fill="#202124"/>
    <text x="28" y="14" class="txt-loc">Curitiba, PR</text>
    <text x="115" y="14" class="txt-link">Escolher região</text>

    <!-- 3 dots menu -->
    <g transform="translate(210, 8)" fill="#70757a">
      <circle cx="0" cy="0" r="1.5"/>
      <circle cx="0" cy="5" r="1.5"/>
      <circle cx="0" cy="10" r="1.5"/>
    </g>
  </g>

  <!-- AI Overview Section -->
  <g transform="translate(180, 192)">
    <!-- Sparkle AI Icon (Four-point gradient blue star) -->
    <path d="M12 0 L15 9 L24 12 L15 15 L12 24 L9 15 L0 12 L9 9 Z" fill="#1a73e8"/>
    <text x="32" y="16" class="txt-ai-title">Visão geral criada por IA</text>

    <!-- Speaker Icon -->
    <g transform="translate(200, 2)">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" fill="#5f6368"/>
    </g>
  </g>

  <!-- AI Overview Text Content -->
  <!-- Highlight box behind text -->
  <rect x="366" y="222" width="328" height="23" fill="#d3e3fd" rx="2"/>
  <rect x="180" y="247" width="410" height="23" fill="#d3e3fd" rx="2"/>

  <text x="180" y="238" class="txt-body">
    <tspan>As principais opções de </tspan>
    <tspan font-weight="600" fill="#041e49">lojas de pneus e centros automotivos em Curitiba que</tspan>
  </text>
  <text x="180" y="263" class="txt-body">
    <tspan font-weight="600" fill="#041e49">oferecem venda de pneus e serviços de oficina mecânica</tspan>
    <tspan fill="#3c4043"> incluem:</tspan>
  </text>

  <!-- Bullet 1: Carplus -->
  <circle cx="184" cy="292" r="2.5" fill="#3c4043"/>
  <text x="198" y="297" class="txt-body">
    <tspan font-weight="700" fill="#1a0dab" text-decoration="underline">Carplus Centro Automotivo</tspan>
    <tspan>: Localizada no bairro Portão (Av. Presid. Arthur da Silva</tspan>
  </text>
  <!-- Highlight box on text for brands -->
  <rect x="180" y="306" width="480" height="22" fill="#f1f3f4" rx="2"/>
  <text x="180" y="322" class="txt-body">
    Bernardes, 1323). Oferece venda de pneus de grandes marcas (Pirelli, Michelin,
  </text>
  <rect x="180" y="331" width="480" height="22" fill="#f1f3f4" rx="2"/>
  <text x="180" y="347" class="txt-body">
    Goodyear, Continental), alinhamento 3D, balanceamento, conserto de rodas e
  </text>
  <text x="180" y="372" class="txt-body">
    mecânica geral.
  </text>
  <!-- Favicon badge -->
  <circle cx="282" cy="368" r="8" fill="#ff5722"/>
  <text x="282" y="372" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
  <text x="294" y="371" font-family="sans-serif" font-size="11" fill="#70757a">www.carpluspneuseofi...</text>
  <rect x="424" y="360" width="18" height="15" rx="3" fill="#e8eaed"/>
  <text x="433" y="371" font-family="sans-serif" font-size="10" fill="#5f6368" text-anchor="middle">+1</text>

  <!-- Bullet 2: Barão Pneus -->
  <circle cx="184" cy="402" r="2.5" fill="#3c4043"/>
  <text x="198" y="407" class="txt-body">
    <tspan font-weight="700" fill="#1a0dab" text-decoration="underline">Barão Pneus</tspan>
    <tspan font-weight="700" fill="#3c4043"> e...</tspan>
    <tspan fill="#3c4043">                     des em bairros como...</tspan>
  </text>

  <!-- Bottom section indicator -->
  <text x="180" y="580" font-family="sans-serif" font-size="18" font-weight="bold" fill="#202124">Locais</text>

  <!-- Right side Cards (AI Overview Sources Panel) -->
  <g transform="translate(820, 220)">
    <!-- Card 1: Barão Pneus -->
    <rect x="0" y="0" width="310" height="110" rx="16" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
    <!-- Checkmark badge -->
    <circle cx="24" cy="20" r="8" fill="#fbbc04"/>
    <path d="M20 20 L23 23 L28 17" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="38" y="24" font-family="sans-serif" font-size="12" fill="#3c4043">Barão Pneus e Oficina</text>
    <text x="20" y="46" class="txt-card-title">Loja de Pneus Curitiba Perto de Mim</text>
    <text x="20" y="64" class="txt-card-sub">Barão Pneus e Oficina: revendedor oficial</text>
    <text x="20" y="78" class="txt-card-sub">Pirelli em Curitiba e Região Metropolitana...</text>

    <!-- Card Image right -->
    <rect x="235" y="40" width="60" height="55" rx="8" fill="#333333"/>
    <circle cx="265" cy="67" r="18" fill="none" stroke="#777777" stroke-width="8"/>

    <!-- Card 2: Carplus (Right Panel) -->
    <g transform="translate(0, 125)">
      <rect x="0" y="0" width="310" height="120" rx="16" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
      <circle cx="20" cy="20" r="8" fill="#ff5722"/>
      <text x="20" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
      <text x="34" y="23" font-family="sans-serif" font-size="12" fill="#3c4043">www.carpluspneuseoficina.com.br</text>

      <text x="20" y="46" class="txt-card-title">Oficina Mecânica e Pneus em</text>
      <text x="20" y="62" class="txt-card-title">Curitiba | Carplus Centro Automotivo</text>

      <text x="20" y="80" class="txt-card-sub">Pneus e Oficina Mecânica em</text>
      <text x="20" y="94" class="txt-card-sub">CuritibaCarplus Centro Automotivo *...</text>

      <!-- Storefront Image -->
      <rect x="235" y="42" width="60" height="60" rx="8" fill="#1a1c23"/>
      <!-- Storefront illustration details -->
      <rect x="240" y="48" width="50" height="30" fill="#2d303e"/>
      <text x="265" y="65" font-family="sans-serif" font-size="8" fill="#ffcc00" text-anchor="middle">CARPLUS</text>
      <rect x="245" y="80" width="20" height="18" fill="#0f1015"/>
    </g>
  </g>

  <!-- OVERLAID POPOVER / TOOLTIP DIALOG IN CENTER -->
  <g transform="translate(290, 370)" filter="url(#shadow)">
    <!-- Popover box -->
    <rect x="0" y="0" width="340" height="200" rx="16" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>

    <!-- Item 1 inside Popover -->
    <circle cx="20" cy="25" r="8" fill="#ff5722"/>
    <text x="20" y="29" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
    <text x="34" y="28" class="txt-pop-url">www.carpluspneuseoficina.com.br</text>

    <!-- 3 dots -->
    <g transform="translate(315, 25)" fill="#70757a">
      <circle cx="0" cy="-4" r="1.5"/>
      <circle cx="0" cy="0" r="1.5"/>
      <circle cx="0" cy="4" r="1.5"/>
    </g>

    <text x="16" y="52" class="txt-pop-title">Oficina Mecânica e Pneus em</text>
    <text x="16" y="68" class="txt-pop-title">Curitiba | Carplus Centro Automotivo</text>

    <text x="16" y="86" class="txt-pop-url">Pneus e Oficina Mecânica em</text>
    <text x="16" y="100" class="txt-pop-url">CuritibaCarplus Centro Automotivo *...</text>

    <!-- Image item 1 -->
    <rect x="255" y="45" width="55" height="50" rx="8" fill="#1e2029"/>
    <rect x="260" y="50" width="45" height="25" fill="#323646"/>
    <text x="282" y="65" font-family="sans-serif" font-size="7" fill="#ffcc00" text-anchor="middle">CARPLUS</text>

    <!-- Separator Line inside Popover -->
    <line x1="16" y1="112" x2="324" y2="112" stroke="#f1f3f4" stroke-width="1"/>

    <!-- Item 2 inside Popover -->
    <circle cx="20" cy="132" r="8" fill="#ff5722"/>
    <text x="20" y="136" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
    <text x="34" y="135" class="txt-pop-url">Carplus Pneus</text>

    <!-- 3 dots -->
    <g transform="translate(315, 132)" fill="#70757a">
      <circle cx="0" cy="-4" r="1.5"/>
      <circle cx="0" cy="0" r="1.5"/>
      <circle cx="0" cy="4" r="1.5"/>
    </g>

    <text x="16" y="156" class="txt-pop-title">Pneus em Curitiba - Melhores Marcas</text>
    <text x="16" y="172" class="txt-pop-title">com Pronta Entrega | Carplus Pneus</text>

    <text x="16" y="188" class="txt-pop-url">Carplus Pneus (Curitiba, Portão: Av. Presid.</text>

    <!-- Tire image item 2 -->
    <rect x="260" y="145" width="45" height="45" rx="6" fill="#f8f9fa"/>
    <circle cx="282" cy="167" r="16" fill="none" stroke="#333333" stroke-width="6"/>
  </g>

  <!-- RED ANNOTATION ARROWS (Matching exact user screenshot) -->
  <!-- Arrow 1: Top left pointing to Carplus bullet in AI text -->
  <g>
    <path d="M 70 200 Q 110 320 158 295" fill="none" stroke="#d9534f" stroke-width="7" stroke-linecap="round"/>
    <polygon points="166,290 142,286 150,305" fill="#d9534f"/>
  </g>

  <!-- Arrow 2: Bottom left pointing to top item in Popover -->
  <g>
    <path d="M 30 520 Q 150 510 260 435" fill="none" stroke="#d9534f" stroke-width="7" stroke-linecap="round"/>
    <polygon points="268,430 248,428 252,448" fill="#d9534f"/>
  </g>

  <!-- Arrow 3: Bottom left pointing to second item in Popover -->
  <g>
    <path d="M 180 600 Q 210 580 250 540" fill="none" stroke="#d9534f" stroke-width="7" stroke-linecap="round"/>
    <polygon points="256,532 238,536 248,552" fill="#d9534f"/>
  </g>

  <!-- Arrow 4: Bottom right pointing to Carplus card in right panel -->
  <g>
    <path d="M 920 540 Q 860 520 830 460" fill="none" stroke="#d9534f" stroke-width="7" stroke-linecap="round"/>
    <polygon points="826,450 820,470 838,465" fill="#d9534f"/>
  </g>
</svg>