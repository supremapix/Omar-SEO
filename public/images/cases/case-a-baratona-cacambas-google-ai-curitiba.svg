    <!-- AI Text Paragraphs -->
    <g transform="translate(0, 32)" font-size="14" fill="#202124" style="line-height:1.5;">
      <text x="0" y="0">O aluguel de caçambas baratas de entulho em Curitiba varia entre <tspan font-weight="bold">R$ 280,00 e R$ 400,00</tspan></text>
      <text x="0" y="22">por locação. O preço final depende do tamanho da caçamba (geralmente de 3 m³ a 5 m³),</text>
      <text x="0" y="44">do tipo de resíduo e do período de permanência (que costuma ser de 3 a 14</text>
      <text x="0" y="66">dias).</text>

      <!-- Pill 1 -->
      <g transform="translate(42, 53)">
        <rect x="0" y="0" width="105" height="20" rx="10" fill="#f1f3f4" stroke="#dadce0" stroke-width="1"/>
        <circle cx="10" cy="10" r="5" fill="#34A853"/>
        <text x="20" y="14" font-size="11" font-weight="500" fill="#3c4043">A Baratona <tspan fill="#70757a">+3</tspan></text>
      </g>

      <text x="0" y="102">As principais empresas de <tspan font-weight="bold">Disk Caçamba</tspan> na região que combinam boas avaliações dos</text>
      <text x="0" y="124">clientes e preços competitivos estão listadas abaixo.</text>

      <!-- Section Subheading -->
      <text x="0" y="162" font-size="16">🚚 <tspan font-weight="bold">Empresas com foco em Preço Baixo e Descontos</tspan></text>
      <text x="0" y="184" font-size="16" font-weight="bold">Regionais</text>

      <!-- Highlight Frame for A Baratona -->
      <rect x="-10" y="196" width="530" height="135" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,4"/>

      <!-- Bullet 1: A Baratona Caçambas -->
      <g transform="translate(0, 212)">
        <text x="0" y="0" font-weight="bold" font-size="14.5" fill="#15803d">• A Baratona Caçambas</text>
        
        <!-- Preço Base -->
        <text x="16" y="22" font-size="13.5" fill="#3c4043">• <tspan font-weight="bold">Preço base:</tspan> A partir de <tspan font-weight="bold">R$ 280,00</tspan> (para caçamba padrão de 5 m³, com permanência</text>
        <text x="26" y="40" font-size="13.5" fill="#3c4043">de 3 a 5 dias).</text>

        <!-- Destaque -->
        <text x="16" y="62" font-size="13.5" fill="#3c4043">• <tspan font-weight="bold">Destaque:</tspan> Foco em preço baixo e atendimento rápido 24h via WhatsApp. Atende</text>
        <text x="26" y="80" font-size="13.5" fill="#3c4043">fortemente bairros como Pinheirinho, Xaxim, Capão Raso e Juvevê.</text>

        <!-- Contato -->
        <text x="16" y="102" font-size="13.5" fill="#3c4043">• <tspan font-weight="bold">Contato:</tspan> <tspan fill="#1a73e8" font-weight="500">(41) 3275-0505</tspan> / WhatsApp (41) 99670-1500.</text>

        <!-- Pill 2 -->
        <g transform="translate(325, 90)">
          <rect x="0" y="0" width="105" height="20" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
          <circle cx="10" cy="10" r="5" fill="#15803d"/>
          <text x="20" y="14" font-size="11" font-weight="bold" fill="#15803d">A Baratona <tspan fill="#16a34a">+1</tspan></text>
        </g>
