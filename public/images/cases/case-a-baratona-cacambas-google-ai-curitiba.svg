        <text x="0" y="0" font-weight="bold" font-size="14.5" fill="#202124">• O Rei da Caçamba</text>
        <text x="16" y="22" font-size="13.5" fill="#3c4043">• <tspan font-weight="bold">Preço base:</tspan> Sob consulta (foco em preço justo).</text>
