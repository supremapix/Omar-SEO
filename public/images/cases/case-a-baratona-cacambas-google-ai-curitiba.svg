      <text x="16" y="58" font-size="12.5" font-weight="700" fill="#1a0dab">Curitiba | A Baratona | Preço R$ 280</text>
      
      <!-- Snippet -->
      <text x="16" y="76" font-size="11" fill="#4d5156">A Baratona: Locação de caçambas em</text>
      <text x="16" y="90" font-size="11" fill="#4d5156">Curitiba (Pinheirinho, Xaxim, Capão Raso).... </text>
      
      <!-- Image Thumbnail -->
      <rect x="235" y="40" width="60" height="55" rx="8" fill="#fef08a"/>
      <rect x="235" y="40" width="60" height="55" rx="8" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="265" y="62" font-size="8" font-weight="900" fill="#854d0e" text-anchor="middle">DESCONTO</text>
      <text x="265" y="73" font-size="8" font-weight="900" fill="#854d0e" text-anchor="middle">ENTULHO</text>
    </g>

    <!-- Card 3: Transdetritos -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="310" height="115" rx="16" fill="#ffffff" stroke="#e3e5e8" stroke-width="1" filter="url(#cardShadow)"/>
      
      <!-- Favicon & Domain -->
      <circle cx="20" cy="20" r="8" fill="#2563eb"/>
      <text x="34" y="24" font-size="11" fill="#4d5156" font-weight="500">Transdetritos</text>
      <circle cx="290" cy="20" r="1.5" fill="#70757a"/>
      
      <!-- Title -->
      <text x="16" y="44" font-size="12.5" font-weight="600" fill="#1a0dab">Aluguel de Caçambas em Curitiba - (41)</text>
      <text x="16" y="58" font-size="12.5" font-weight="600" fill="#1a0dab">3347-1110 | Transdetritos</text>
      
      <!-- Snippet -->
      <text x="16" y="76" font-size="11" fill="#4d5156">Transdetritos: +36 anos locação caçambas</text>
      <text x="16" y="90" font-size="11" fill="#4d5156">Curitiba e região. Contato: (41) 3347-1110....</text>
      
      <!-- Image Thumbnail -->
      <rect x="235" y="40" width="60" height="55" rx="8" fill="#93c5fd"/>
      <path d="M242 70 L258 70 L262 60 L280 60 L280 75 L242 75 Z" fill="#1e3a8a"/>
      <circle cx="250" cy="76" r="4" fill="#1f2937"/>
      <circle cx="272" cy="76" r="4" fill="#1f2937"/>
    </g>

    <!-- Mostrar tudo Button -->
    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="310" height="36" rx="18" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
      <text x="155" y="23" font-size="13" font-weight="500" fill="#3c4043" text-anchor="middle">Mostrar tudo</text>
    </g>
