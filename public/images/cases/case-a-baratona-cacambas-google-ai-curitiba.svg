    <text x="18" y="-1" font-weight="600" fill="#202124">R. Irmão Gabriel Lourenço da Veiga - Cidade Industrial, Curitib...</text>
    <text x="385" y="-1" fill="#1a73e8">· Escolher região</text>
    <circle cx="480" cy="-4" r="1.5" fill="#70757a"/>
  </g>

  <!-- AI Overview Container -->
