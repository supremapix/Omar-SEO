    </g>
  </g>

  <!-- Search Tabs -->
  <g transform="translate(145, 75)" font-size="13" fill="#5f6368">
    <text x="0" y="0">Modo IA</text>
    <text x="65" y="0" fill="#1a73e8" font-weight="600">Tudo</text>
    <line x1="65" y1="6" x2="95" y2="6" stroke="#1a73e8" stroke-width="2.5"/>
    <text x="115" y="0">Imagens</text>
    <text x="180" y="0">Vídeos</text>
    <text x="235" y="0">Shopping</text>
    <text x="310" y="0">Vídeos curtos</text>
    <text x="405" y="0">Notícias</text>
    <text x="468" y="0">Mais ▾</text>
    <text x="525" y="0">Ferramentas ▾</text>
