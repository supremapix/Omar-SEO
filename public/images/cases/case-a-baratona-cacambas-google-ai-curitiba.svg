      <text x="16" y="90" font-size="11" fill="#4d5156">Contact: (41) 3247-4009 / WhatsApp (41)...</text>
      
      <!-- Image Thumbnail -->
      <rect x="235" y="40" width="60" height="55" rx="8" fill="#d1d5db"/>
      <!-- Truck Graphic -->
      <path d="M242 70 L258 70 L262 62 L280 62 L280 75 L242 75 Z" fill="#4b5563"/>
      <circle cx="250" cy="76" r="4" fill="#1f2937"/>
      <circle cx="272" cy="76" r="4" fill="#1f2937"/>
    </g>

